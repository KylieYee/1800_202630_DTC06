                <h2 class="mb-4">Create a Goal</h2>
    
                <form id="goal-form">
    
                    <div class="mb-3">
                        <label for="goal-title" class="form-label">

                    </div>
    
                    <button type="submit" class="btn btn-primary">
                        Save Goal
