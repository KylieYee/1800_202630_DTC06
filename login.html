<!doctype html>
<html lang="en">
  <head>
    <title>Login</title>
    <meta name="Login" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Navigation bar start -->
    <header class="p-2" style="background-color: grey;">
      <nav class="navbar navbar-expand-md">
        <div class="container-fluid">
    
          <!-- Moon logo -->
          <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRTZZrRqTCtuxp8DE4qTXfGporgJrpz1On3Dmg-eOlG7w&s=10"
              alt="Moon logo" class="rounded-circle border border-2 border-white"
              style="width: 48px; height: 48px; object-fit: cover;">
          </a>
    
          <!-- Mobile menu button -->
          <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
            aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
    
          <!-- Navigation links -->
          <div class="collapse navbar-collapse justify-content-center" id="mainNavbar">
            <div class="navbar-nav text-center">
              <a href="index.html" class="nav-link px-3 text-white">Home</a>
              <a href="Event.html" class="nav-link px-3 text-white">Event</a>
              <a href="tracker.html" class="nav-link px-3 text-white">Tracker</a>
              <a href="reminder.html" class="nav-link px-3 text-white">Reminder</a>
              <a href="profile.html" class="nav-link px-3 text-white">Profile</a>
            </div>
          </div>
    
        </div>
      </nav>
    </header>
    <!-- Navigation bar end -->

    <!-- Main content goes here -->

    <div class="container py-5" style="max-width: 420px">
      <!-- Alerts -->
      <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

      <!-- Login -->
      <div id="loginView">
        <h3 class="mb-3 text-center">Login</h3>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <input
              type="email"
              id="loginEmail"
              class="form-control"
              placeholder="Email"
              required
            />
          </div>
          <div class="mb-3">
            <input
              type="password"
              id="loginPassword"
              class="form-control"
              placeholder="Password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <small class="d-block mt-3 text-center">
          Don’t have an account?
          <a href="#" id="toSignup">Sign up</a>
        </small>
      </div>

      <!-- Signup -->
      <div id="signupView" class="d-none">
        <h3 class="mb-3 text-center">Sign Up</h3>
        <form id="signupForm" novalidate>
          <div class="mb-3">
            <input
              type="text"
              id="signupName"
              class="form-control"
              placeholder="First and Last Name"
              aria-label="Full name"
              required
            />
          </div>
          <div class="mb-3">
            <input
              type="email"
              id="signupEmail"
              class="form-control"
              placeholder="Email"
              required
            />
          </div>
          <div class="mb-3">
            <input
              type="password"
              id="signupPassword"
              class="form-control"
              placeholder="Password"
              required
            />
          </div>
          <button type="submit" class="btn btn-success w-100">
            Create Account
          </button>
        </form>
        <small class="d-block mt-3 text-center">
          Already have an account?
          <a href="#" id="toLogin">Login</a>
        </small>
      </div>
    </div>



    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <!-- Firebase and authentication related scripts -->
    <!-- The order of loading matters -->
    <script type="module" src="/src/loginSignup.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
