<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My BCIT Project</title>
  </head>

  <body class="">
    <main>
      <br />
      <form id="reminderForm">
        <div class="d-flex align-items-center justify-content-center gap-2 p-2">
          <button
            style="width: 5%"
            onclick="window.location.href = 'reminder.html'"
          >
            &lt;
          </button>
          <input
            class="border p-2 rounded"
            style="width: 35%"
            id="reminder-title"
            placeholder="Enter Title"
            required
          />
        </div>
        <div
          class="d-flex align-items-center justify-content-center gap-2 p-2"
          style="background-color: grey"
        >
          <label for="date-select">Set date:</label>
          <input type="date" id="date-select" name="date-select" />
          <label for="time-select">Set time:</label>
          <input type="time" id="time-select" />
          <label for="reminder-frequency">Repeat:</label>
          <select id="reminder-frequency" name="frequency">
            <option value="never" selected>Never</option>
            <option value="once">Hourly</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
        <div
          class="d-flex flex-column align-items-center justify-content-center gap-2 p-2"
        >
          <textarea
            style="width: 40%"
            id="reminder-details"
            placeholder="Enter details"
            required
          ></textarea>
          <button type="submit">Create Reminder</button>
        </div>
      </form>
    </main>
    <script type="module" src="/src/createReminder.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
